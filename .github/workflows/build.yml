name: Build

permissions:
  contents: none

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  build-toolchain:
    timeout-minutes: 30  # includes handing the ~6 GB image to GitHub as an artifact
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The image and its saved tar need ~12 GB; a hosted runner has ~14 GB free before this.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build conversion toolchain image
        run: bash conversion-toolchain/build-toolchain.sh

      # Docker layers are mostly incompressible binaries: a low level keeps the upload fast.
      - name: Keep the toolchain image for the tests and the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: toolchain-image
          path: conversion-toolchain/artifacts/oaax-deepx-toolchain.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

  unit-tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Runtime unit tests (mock DX-RT, no hardware needed)
        run: |
          cmake -S runtime-library/test -B build-unit-tests -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-unit-tests -j"$(nproc)"
          (cd build-unit-tests && ./test_runtime)

      - name: Runtime unit tests under ASan + UBSan
        run: |
          cmake -S runtime-library/test -B build-unit-tests-san -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build-unit-tests-san -j"$(nproc)"
          (cd build-unit-tests-san && ./test_runtime)

      - name: Python unit tests
        run: |
          pip install pytest
          pytest tests/test_models.py

  # The same mock DX-RT unit tests built with MSVC, so Windows-only breakage shows up without the DX-RT SDK.
  unit-tests-windows:
    timeout-minutes: 15
    runs-on: windows-2022  # provides the Visual Studio 2022 generator used below

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Runtime unit tests (mock DX-RT, MSVC)
        shell: pwsh
        run: |
          cmake -S runtime-library/test -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          build\Debug\test_runtime.exe

  build-runtime-ubuntu:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ubuntu_version: ["20.04", "22.04", "24.04"]
        arch: ["x86_64", "aarch64"]
      fail-fast: false

    name: Build runtime for ${{ matrix.arch }}-ubuntu-${{ matrix.ubuntu_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4

      - name: Download DX RT
        run: |
          cd runtime-library
          dxrt_version=$(cat ./dxrt_version.txt)
          wget https://github.com/DEEPX-AI/dx_rt/archive/refs/tags/v${dxrt_version}.zip
          unzip v*.zip
          rm v*.zip
          mv dx_rt-* dx_rt

      - name: Compile runtime
        run: |
          cd runtime-library
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            ./build-runtimes.sh --ubuntu_version ${{ matrix.ubuntu_version }} --cross-aarch64
          else
            ./build-runtimes.sh --ubuntu_version ${{ matrix.ubuntu_version }}
          fi

      - name: Keep the runtime for the tests and the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: runtime-${{ matrix.arch }}-ubuntu${{ matrix.ubuntu_version }}
          path: runtime-library/artifacts/${{ matrix.arch }}-ubuntu${{ matrix.ubuntu_version }}/library-*.tar.gz
          retention-days: 1
          if-no-files-found: error

  # Builds DX-RT from the public dx_rt source (the DX-SDK Windows Installer needs a login), then the DLL against it.
  build-runtime-windows:
    name: Build runtime for x86_64-windows
    timeout-minutes: 60  # includes building DX-RT
    runs-on: windows-2022  # build-windows.ps1 uses Visual Studio 2022
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download DX RT
        shell: pwsh
        run: |
          $tag = "v" + (Get-Content runtime-library/dxrt_version.txt -Raw).Trim()
          git clone --depth 1 --branch $tag https://github.com/DEEPX-AI/dx_rt.git runtime-library/dx_rt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      # DX-RT's vcpkg dependencies (gtest), built once per dx_rt manifest.
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('runtime-library/dx_rt/vcpkg.json', 'runtime-library/dx_rt/vcpkg-configuration.json') }}

      - name: Compile runtime
        shell: pwsh
        run: ./runtime-library/build-windows.ps1 -Configuration Release

      # The publish job uploads it (scripts/publish-artifacts.sh picks this artifact up when it exists).
      - name: Keep the runtime for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: runtime-x86_64-windows
          path: runtime-library\artifacts\x86_64-windows\library-*.tar.gz
          retention-days: 1
          if-no-files-found: error

  # Opt-in: set repository variable RUN_INTEGRATION_TESTS=true to enable stage 1 (conversion).
  # Stage 2 additionally needs DeepX hardware on the runner: set RUN_STAGE2=true only then.
  integration-tests:
    if: vars.RUN_INTEGRATION_TESTS == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 30
    runs-on: hetzner
    needs: [build-toolchain, build-runtime-ubuntu]
    container:
      image: ubuntu:22.04
      options: --volume /var/run/docker.sock:/var/run/docker.sock
    permissions:
      actions: write

    steps:
      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get install -y git docker.io python3 python3-pip cmake g++
          pip3 install uv

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python environment
        run: uv sync -q

      # The bytes built by this run, not whatever the bucket holds under the version or branch name.
      - name: Download the runtime library
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: runtime-x86_64-ubuntu22.04
          path: runtime-library/artifacts/x86_64-ubuntu22.04

      - name: Unpack the runtime library
        run: tar xzf runtime-library/artifacts/x86_64-ubuntu22.04/library-*.tar.gz -C runtime-library/artifacts/x86_64-ubuntu22.04/

      - name: Download the toolchain image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: toolchain-image
          path: /tmp/toolchain

      - name: Load toolchain Docker image
        run: |
          docker load -i /tmp/toolchain/oaax-deepx-toolchain.tar
          rm -r /tmp/toolchain

      - name: Verify Docker and toolchain image
        run: |
          docker info
          docker images oaax-deepx-toolchain:latest

      - name: Stage 1 — convert models and run toolchain tests
        env:
          DEEPX_TOOLCHAIN_IMAGE: oaax-deepx-toolchain:latest
        run: uv run python tests/stage1.py

      - name: Upload compiled models
        uses: actions/upload-artifact@v4
        with:
          name: compiled-models
          path: tests/compiled_models/
          retention-days: 1

      - name: Stage 2 — build inference runner and run inference tests
        if: vars.RUN_STAGE2 == 'true'
        run: uv run python tests/stage2.py --csv tests/stage2_results.csv

      - name: Upload stage2 results
        if: always() && vars.RUN_STAGE2 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stage2-results
          path: tests/stage2_results.csv
          if-no-files-found: ignore

      - name: Upload conversion logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conversion-logs
          path: tests/compiled_models/**/convert.log
          if-no-files-found: warn

  # Runs after every build and test passed and uploads the bytes that were tested:
  #   v* tag               -> <VERSION>/ (write once) and latest/, the release
  #   pull request         -> <branch>/ (overwritten on every run, removed when the PR closes), for testing
  #   anything else (a push to main), or a PR without secrets (fork, Dependabot) -> dry run: files checked, keys printed
  publish:
    name: Publish to the OAAX bucket
    timeout-minutes: 45
    runs-on: ubuntu-22.04
    needs: [unit-tests, unit-tests-windows, build-toolchain, build-runtime-ubuntu, build-runtime-windows, integration-tests]
    # integration-tests (opt-in) is skipped by default, which would skip this job too.
    # build-toolchain is skipped for PRs from forks: nothing to publish there.
    if: >-
      ${{ always()
      && needs.unit-tests.result == 'success'
      && needs.unit-tests-windows.result == 'success'
      && needs.build-toolchain.result == 'success'
      && needs.build-runtime-ubuntu.result == 'success'
      && needs.build-runtime-windows.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.integration-tests.result) }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0  # the tag check below needs main's history

      - name: Tag must match VERSION and be on main
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [ "${TAG#v}" = "$(cat VERSION)" ] || { echo "tag $TAG does not match VERSION $(cat VERSION)"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$TAG is not on main, tag a commit of main"; exit 1; }

      - name: Download the build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts
          pattern: "{runtime-*,toolchain-image}"  # not the test logs

      - name: Install s3cmd
        run: sudo apt-get update -y && sudo apt-get install -y s3cmd

      - name: Upload to S3
        env:
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
        # The branch name reaches the script only through the environment (GITHUB_HEAD_REF), never through ${{ }}.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            mode=release name=$(cat VERSION)
          elif [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "$S3_ACCESS_KEY" ]; then
            mode=branch name=$GITHUB_HEAD_REF
          else
            mode=dry name=$(cat VERSION)
          fi
          bash scripts/publish-artifacts.sh "$mode" "$name" artifacts
