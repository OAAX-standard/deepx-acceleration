name: Delete test runtimes and toolchain on PR close

permissions:
  contents: none

on:
  pull_request:
    types:
      - closed

jobs:
  delete-temporary-artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Install s3cmd
        run: |
          sudo apt-get update
          sudo apt-get install -y s3cmd

      - name: Configure s3cmd
        run: |
          cat > ~/.s3cfg <<EOF
          [default]
          access_key = ${{ secrets.S3_ACCESS_KEY }}
          secret_key = ${{ secrets.S3_SECRET_KEY }}
          bucket_location = us-east-1
          host_base = ${{ secrets.S3_ENDPOINT_URL }}
          host_bucket = %(bucket)s.${{ secrets.S3_ENDPOINT_URL }}
          use_https = True
          EOF

      - name: Determine version
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Never touch the release folders: a branch named "latest" or "2.0.0"
          # would otherwise delete published artifacts.
          if [[ "$HEAD_REF" =~ ^(latest|[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Refusing to delete artifacts for reserved version name '$HEAD_REF'" >&2
            exit 1
          fi
          echo "version=${HEAD_REF}" >> "$GITHUB_ENV"

      - name: Delete runtimes and toolchain folders from S3
        run: |
          s3cmd del --recursive "s3://oaax/runtimes/${version}/DEEPX/" || echo "Warning: No runtime-library found for version ${version}"
          s3cmd del --recursive "s3://oaax/conversion-toolchain/${version}/DEEPX/" || echo "Warning: No conversion-toolchain found for version ${version}"
