# Skip generated / vendored directories for all hooks.
exclude: ^(runtime-library/deps/|\.venv/)

repos:
  # ── General file hygiene ─────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'          # preserve intentional trailing spaces in Markdown
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]

  # ── Python: ruff (lint + format) ─────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff          # lint, with auto-fix
        args: [--fix]
      - id: ruff-format   # format (black-compatible)

  # ── C / C++: clang-format ────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.0
    hooks:
      - id: clang-format
        types_or: [c, c++]

  # ── Shell: shellcheck ────────────────────────────────────────────────────────
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  # ── Dockerfile: hadolint ─────────────────────────────────────────────────────
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args:
          - --ignore=DL3008  # version pinning — not practical for internal build images
          - --ignore=DL3003  # WORKDIR vs cd — would require significant restructuring
          - --ignore=DL3009  # delete apt lists — handled at image cleanup stage
